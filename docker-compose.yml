services:
  postgres:
    image: postgres:16-alpine
    container_name: autobody-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autobody
      POSTGRES_PASSWORD: autobody
      POSTGRES_DB: autobody
    ports:
      - "5432:5432"
    volumes:
      - autobody_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobody -d autobody"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autobody_pgdata:
